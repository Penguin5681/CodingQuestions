<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="faq-item">
        <div class="faq-question"><span class="icon">+</span> What is your return policy?</div>
        <div class="faq-answer hidden">Items can be returned within 30 days.</div>
    </div>
    <div class="faq-item">
        <div class="faq-question"><span class="icon">+</span> Do you ship internationally?</div>
        <div class="faq-answer hidden">Yes, to over 40 countries.</div>
    </div>
    <div class="faq-item">
        <div class="faq-question"><span class="icon">+</span> How do I track my order?</div>
        <div class="faq-answer hidden">Use the tracking link in your confirmation email.</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
